<rect x="613.3" y="1121.0" width="14.0" height="14.0" rx="3" fill="#9ca3af" stroke="none" stroke-width="1.5" opacity="1"/>
<text x="635.3" y="1133.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Stellar / fiat rails</text>
