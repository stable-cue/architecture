<text x="1204.0" y="1018.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Client-bound addresses</text>
<text x="1204.0" y="1042.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Pre-bound G… / M… destination accounts</text>
