<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1170" width="1640" height="1170" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Stablecue architecture overview</title><desc id="d">Layered diagram: institutional clients call the Stablecue orchestration engine over HTTPS and OAuth2. The engine calls regulated Anchor Platform partners using SEP-10, SEP-12 and SEP-24. Partners settle stablecoins on the Stellar network. Stablecue only reads the ledger.</desc>
<defs><marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#14b8a6"/></marker><marker id="ah-sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6366f1"/></marker><marker id="ah-partner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#f59e0b"/></marker><marker id="ah-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#9ca3af"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#f87171"/></marker></defs>
<rect width="1640" height="1170" rx="16" fill="#262626"/>
<text x="40.0" y="48.0" font-size="24" font-weight="700" fill="#f2f2f2" text-anchor="start">Stablecue architecture</text>
<text x="40.0" y="74.0" font-size="14" font-weight="400" fill="#b5b5b5" text-anchor="start">Anchor Platform integration  ·  Tranches 1–3  ·  Stellar</text>
<rect x="40.0" y="100.0" width="1520.0" height="100.0" rx="16" fill="#14b8a6" stroke="#14b8a6" stroke-width="1.5" opacity="0.07"/>
<rect x="40.0" y="100.0" width="1520.0" height="100.0" rx="16" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.8"/>
<text x="62.0" y="130.0" font-size="12.5" font-weight="700" fill="#5eead4" text-anchor="start" letter-spacing="1.5">INSTITUTIONAL B2B CLIENTS</text>
<rect x="275.0" y="138.0" width="330.0" height="48.0" rx="10" fill="#303030" stroke="#14b8a6" stroke-width="1.2" opacity="1"/>
<text x="291.0" y="166.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Client A: treasury / application</text>
<rect x="645.0" y="138.0" width="330.0" height="48.0" rx="10" fill="#303030" stroke="#14b8a6" stroke-width="1.2" opacity="1"/>
<text x="661.0" y="166.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Client B: asset manager</text>
<rect x="1015.0" y="138.0" width="330.0" height="48.0" rx="10" fill="#303030" stroke="#14b8a6" stroke-width="1.2" opacity="1"/>
<text x="1031.0" y="166.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Client C: OTC desk</text>
<line x1="640.0" y1="200.0" x2="640.0" y2="260.0" stroke="#14b8a6" stroke-width="1.8" marker-end="url(#ah-client)"/>
<text x="654.0" y="235.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">API requests: HTTPS + OAuth2</text>
<line x1="1000.0" y1="260.0" x2="1000.0" y2="200.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="1014.0" y="235.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Intent status and webhooks</text>
<rect x="40.0" y="260.0" width="1520.0" height="405.0" rx="16" fill="#6366f1" stroke="#6366f1" stroke-width="1.5" opacity="0.07"/>
<rect x="40.0" y="260.0" width="1520.0" height="405.0" rx="16" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.8"/>
<text x="62.0" y="290.0" font-size="12.5" font-weight="700" fill="#a5a8f8" text-anchor="start" letter-spacing="1.5">STABLECUE ORCHESTRATION ENGINE</text>
<text x="62.0" y="312.0" font-size="13.5" font-weight="400" fill="#b5b5b5" text-anchor="start">A pure technology layer: it orchestrates regulated partners and never touches funds.</text>
<rect x="60.0" y="330.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="76.0" y="358.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">API Gateway</text>
<text x="76.0" y="382.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">OAuth2 authentication, per-client rate limits and a</text>
<text x="76.0" y="400.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">key-value store for keys and limits.</text>
<rect x="436.0" y="330.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="452.0" y="358.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Routing Engine</text>
<text x="452.0" y="382.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Selects the Anchor Platform partner by jurisdiction,</text>
<text x="452.0" y="400.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">rail availability and volume.</text>
<rect x="812.0" y="330.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="828.0" y="358.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Intent State Machine</text>
<text x="828.0" y="382.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Persists every transition from created to completed,</text>
<text x="828.0" y="400.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">failed, refunded or expired.</text>
<rect x="1188.0" y="330.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="1204.0" y="358.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Event Log</text>
<text x="1204.0" y="382.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Append-only audit trail linking intent ID, partner</text>
<text x="1204.0" y="400.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">transaction ID and Stellar tx hash.</text>
<rect x="60.0" y="450.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="76.0" y="478.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Stellar Address Validator</text>
<text x="76.0" y="502.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">StrKey and memo checks; account exists and</text>
<text x="76.0" y="520.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">trustline present before any execution.</text>
<rect x="436.0" y="450.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="452.0" y="478.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Anchor Platform Client</text>
<text x="452.0" y="502.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">SEP-10, SEP-12 and SEP-24 adapters. SEP-31</text>
<text x="452.0" y="520.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">interface designed.</text>
<rect x="812.0" y="450.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="828.0" y="478.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Reconciliation</text>
<text x="828.0" y="502.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Signed partner callbacks as primary sync,</text>
<text x="828.0" y="520.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">heartbeat poller as fallback.</text>
<rect x="1188.0" y="450.0" width="352.0" height="100.0" rx="10" fill="#303030" stroke="#6366f1" stroke-width="1.2" opacity="1"/>
<text x="1204.0" y="478.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Expiry and Compensation</text>
<text x="1204.0" y="502.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Intent TTL, retry with backoff, refund tracking from</text>
<text x="1204.0" y="520.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">partner status.</text>
<rect x="60.0" y="576.0" width="1480.0" height="54.0" rx="10" fill="#6366f1" stroke="none" stroke-width="1.5" opacity="0.16"/>
<text x="800.0" y="608.0" font-size="14" font-weight="700" fill="#f2f2f2" text-anchor="middle">Non-custodial boundary: Stablecue holds no private keys, no client funds and no KYC/KYB data (verification status references only).</text>
<line x1="640.0" y1="665.0" x2="640.0" y2="725.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="654.0" y="700.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">SEP-10 · SEP-12 · SEP-24 over HTTPS</text>
<line x1="1000.0" y1="725.0" x2="1000.0" y2="665.0" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#ah-partner)"/>
<text x="1014.0" y="700.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Signed status callbacks</text>
<rect x="40.0" y="725.0" width="1520.0" height="160.0" rx="16" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5" opacity="0.07"/>
<rect x="40.0" y="725.0" width="1520.0" height="160.0" rx="16" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
<text x="62.0" y="755.0" font-size="12.5" font-weight="700" fill="#fcd34d" text-anchor="start" letter-spacing="1.5">ANCHOR PLATFORM PARTNERS (REGULATED CASPs)</text>
<rect x="60.0" y="775.0" width="500.0" height="90.0" rx="10" fill="#303030" stroke="#f59e0b" stroke-width="1.2" opacity="1"/>
<text x="76.0" y="803.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Partner 1: regulated CASP</text>
<text x="76.0" y="827.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Runs the Anchor Platform SEP servers. Accepts and pays out fiat, converts,</text>
<text x="76.0" y="845.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">delivers on-chain.</text>
<rect x="584.0" y="775.0" width="500.0" height="90.0" rx="10" fill="#303030" stroke="#f59e0b" stroke-width="1.2" opacity="1"/>
<text x="600.0" y="803.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Partner 2: regulated CASP</text>
<text x="600.0" y="827.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Same interface under an independent licence and compliance framework.</text>
<rect x="1108.0" y="775.0" width="432.0" height="90.0" rx="10" fill="#303030" stroke="#9ca3af" stroke-width="1.2" opacity="1"/>
<text x="1124.0" y="803.0" font-size="15.5" font-weight="700" fill="#f2f2f2" text-anchor="start">Fiat rails</text>
<text x="1124.0" y="827.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">SEPA and bank transfers between client banks and partners.</text>
<line x1="800.0" y1="885.0" x2="800.0" y2="945.0" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#ah-partner)"/>
<text x="814.0" y="920.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">On-chain settlement: anchor-signed payments</text>
<rect x="40.0" y="945.0" width="1520.0" height="140.0" rx="16" fill="#9ca3af" stroke="#9ca3af" stroke-width="1.5" opacity="0.07"/>
<rect x="40.0" y="945.0" width="1520.0" height="140.0" rx="16" fill="none" stroke="#9ca3af" stroke-width="1.5" opacity="0.8"/>
<text x="62.0" y="975.0" font-size="12.5" font-weight="700" fill="#d1d5db" text-anchor="start" letter-spacing="1.5">STELLAR NETWORK</text>
<rect x="60.0" y="990.0" width="352.0" height="70.0" rx="10" fill="#303030" stroke="#9ca3af" stroke-width="1.2" opacity="1"/>
