<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 760" width="1640" height="760" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Intent state machine</title><desc id="d">Intent states: INTENT_CREATED, AUTHENTICATED, VERIFIED, EXECUTING, ON_CHAIN_RELEASED, COMPLETED. Any in-flight state can end as FAILED or EXPIRED. FAILED can lead to REFUNDED.</desc>
<defs><marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#14b8a6"/></marker><marker id="ah-sc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#6366f1"/></marker><marker id="ah-partner" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#f59e0b"/></marker><marker id="ah-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#9ca3af"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#f87171"/></marker></defs>
<rect width="1640" height="760" rx="16" fill="#262626"/>
<text x="40.0" y="48.0" font-size="24" font-weight="700" fill="#f2f2f2" text-anchor="start">Intent state machine</text>
<text x="40.0" y="74.0" font-size="14" font-weight="400" fill="#b5b5b5" text-anchor="start">Deposit and withdrawal intents  ·  every transition is appended to the event log</text>
<rect x="48.0" y="108.0" width="1274.0" height="190.0" rx="18" fill="none" stroke="#b5b5b5" stroke-width="1.2" opacity="0.7" stroke-dasharray="6 6"/>
<text x="66.0" y="134.0" font-size="12" font-weight="700" fill="#b5b5b5" text-anchor="start" letter-spacing="1.5">IN-FLIGHT (NON-TERMINAL)</text>
<rect x="60.0" y="170.0" width="170.0" height="70.0" rx="12" fill="#303030" stroke="#6366f1" stroke-width="1.5" opacity="1"/>
<text x="145.0" y="211.0" font-size="13.5" font-weight="700" fill="#f2f2f2" text-anchor="middle">INTENT_CREATED</text>
<line x1="234.0" y1="205.0" x2="326.0" y2="205.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="280.0" y="183.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">JWT valid</text>
<text x="280.0" y="198.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">(SEP-10)</text>
<rect x="330.0" y="170.0" width="170.0" height="70.0" rx="12" fill="#303030" stroke="#6366f1" stroke-width="1.5" opacity="1"/>
<text x="415.0" y="211.0" font-size="13.5" font-weight="700" fill="#f2f2f2" text-anchor="middle">AUTHENTICATED</text>
<line x1="504.0" y1="205.0" x2="596.0" y2="205.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="550.0" y="183.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">KYC accepted</text>
<text x="550.0" y="198.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">by CASP</text>
<rect x="600.0" y="170.0" width="170.0" height="70.0" rx="12" fill="#303030" stroke="#6366f1" stroke-width="1.5" opacity="1"/>
<text x="685.0" y="211.0" font-size="13.5" font-weight="700" fill="#f2f2f2" text-anchor="middle">VERIFIED</text>
<line x1="774.0" y1="205.0" x2="866.0" y2="205.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="820.0" y="183.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">CASP order</text>
<text x="820.0" y="198.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">created</text>
<rect x="870.0" y="170.0" width="170.0" height="70.0" rx="12" fill="#303030" stroke="#6366f1" stroke-width="1.5" opacity="1"/>
<text x="955.0" y="211.0" font-size="13.5" font-weight="700" fill="#f2f2f2" text-anchor="middle">EXECUTING</text>
<line x1="1044.0" y1="205.0" x2="1136.0" y2="205.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="1090.0" y="183.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">On-chain leg</text>
<text x="1090.0" y="198.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">verified</text>
<rect x="1140.0" y="170.0" width="170.0" height="70.0" rx="12" fill="#303030" stroke="#6366f1" stroke-width="1.5" opacity="1"/>
<text x="1225.0" y="211.0" font-size="13.5" font-weight="700" fill="#f2f2f2" text-anchor="middle">ON_CHAIN_RELEASED</text>
<line x1="1314.0" y1="205.0" x2="1406.0" y2="205.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#ah-sc)"/>
<text x="1360.0" y="183.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">CASP order</text>
<text x="1360.0" y="198.0" font-size="12" font-weight="400" fill="#b5b5b5" text-anchor="middle">complete</text>
<rect x="1410.0" y="170.0" width="170.0" height="70.0" rx="12" fill="#6366f1" stroke="#6366f1" stroke-width="2.5" opacity="1"/>
<text x="1495.0" y="211.0" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">COMPLETED</text>
<rect x="160.0" y="450.0" width="180.0" height="70.0" rx="12" fill="#303030" stroke="#f87171" stroke-width="2.5" opacity="1"/>
<text x="250.0" y="491.0" font-size="14" font-weight="700" fill="#f2f2f2" text-anchor="middle">FAILED</text>
<rect x="600.0" y="450.0" width="180.0" height="70.0" rx="12" fill="#303030" stroke="#9ca3af" stroke-width="2.5" opacity="1"/>
<text x="690.0" y="491.0" font-size="14" font-weight="700" fill="#f2f2f2" text-anchor="middle">REFUNDED</text>
<rect x="1080.0" y="450.0" width="180.0" height="70.0" rx="12" fill="#303030" stroke="#9ca3af" stroke-width="2.5" opacity="1"/>
<text x="1170.0" y="491.0" font-size="14" font-weight="700" fill="#f2f2f2" text-anchor="middle">EXPIRED</text>
<line x1="250.0" y1="298.0" x2="250.0" y2="446.0" stroke="#f87171" stroke-width="1.8" marker-end="url(#ah-fail)"/>
<text x="264.0" y="360.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="start">CASP error · KYC rejected</text>
<text x="264.0" y="378.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="start">or validation failure</text>
<line x1="690.0" y1="298.0" x2="690.0" y2="446.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah-chain)"/>
<text x="704.0" y="360.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="start">CASP reports refund</text>
<line x1="1170.0" y1="298.0" x2="1170.0" y2="446.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah-chain)"/>
<text x="1184.0" y="360.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="start">TTL reached before COMPLETED;</text>
<text x="1184.0" y="378.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="start">client notified</text>
<line x1="344.0" y1="485.0" x2="596.0" y2="485.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ah-chain)"/>
<text x="472.0" y="468.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="middle">Funds already received:</text>
<text x="472.0" y="504.0" font-size="12.5" font-weight="400" fill="#b5b5b5" text-anchor="middle">CASP refunds</text>
<rect x="60.0" y="590.0" width="1520.0" height="116.0" rx="12" fill="#6366f1" stroke="none" stroke-width="1.5" opacity="0.12"/>
<text x="84.0" y="622.0" font-size="14" font-weight="700" fill="#a5a8f8" text-anchor="start">Notes</text>
<text x="84.0" y="648.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">ON_CHAIN_RELEASED: the CASP reported the Stellar leg and Stablecue verified it read-only in a closed ledger.</text>
<text x="84.0" y="667.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">Deposit: the asset reached the client address. Withdrawal: the client payment reached the CASP.</text>
<text x="84.0" y="686.0" font-size="13" font-weight="400" fill="#b5b5b5" text-anchor="start">COMPLETED: the CASP order is complete. COMPLETED, FAILED, REFUNDED and EXPIRED are terminal; the event log is append-only.</text>
</svg>
